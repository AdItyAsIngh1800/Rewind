name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # Integration tests run against an ephemeral Postgres, never against Supabase.
    # Tests that mutate a shared hosted database are neither hermetic nor
    # repeatable, and pointing CI at the real project to run them would trade a
    # real property for a cosmetic consistency. See ADR-0003.
    #
    # The image carries pgvector because Supabase has the `vector` extension
    # enabled (supabase/migrations/…_extensions_rls_buckets.sql). Same engine but
    # a different extension set is a container that passes on a schema the real
    # database would reject — hermetic and wrong is not an improvement.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rewind
          POSTGRES_PASSWORD: rewind
          POSTGRES_DB: rewind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://rewind:rewind@localhost:5432/rewind

    steps:
      - uses: actions/checkout@v4

      # Mirrors supabase/migrations for the two things Alembic does not own:
      # the extension, and the search_path that lets an unqualified `vector`
      # column type resolve the way it does on Supabase.
      - name: Match the Supabase extension set
        run: |
          psql "postgresql://rewind:rewind@localhost:5432/rewind" <<'SQL'
          create schema if not exists extensions;
          create extension if not exists vector with schema extensions;
          alter database rewind set search_path to "$user", public, extensions;
          SQL

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Blocking, not advisory. A type error is a defect, and `|| true` on a
      # quality gate means the gate does not exist.
      - name: Type check
        run: uv run mypy packages services apps/api apps/worker scripts

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      - name: API contract is not stale
        run: uv run python scripts/export_openapi.py --check

      - name: Test
        run: uv run pytest -q
