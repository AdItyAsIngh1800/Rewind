name: Keep Supabase awake

# Free-tier Supabase projects pause after roughly seven days of inactivity.
# Over a 20-week build with quiet weeks, that will happen at least once, and it
# always happens at the least convenient moment. A weekly read keeps it awake.
#
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY.
# The anon key is safe here: RLS is enabled deny-by-default, so it reads nothing.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret is not set — skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "REST API responded $code"
          # 200 and 401 both prove the project is awake. Only a timeout or 5xx
          # means it is paused or unhealthy.
          case "$code" in
            200|401|404) exit 0 ;;
            *) echo "Project may be paused or unhealthy."; exit 1 ;;
          esac
