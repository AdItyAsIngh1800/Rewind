server {
    listen 80;
    root /usr/share/nginx/html;

    # Replay footage is streamed through here; unbuffered so seeks (range requests)
    # reach the API immediately rather than after nginx has read the whole clip.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Client-side routes (/cases/..., /health) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
