# Development backing services.
#
# Redis for the ARQ job queue while the API and worker run on the host, so the worker
# can use MPS on Apple silicon. The database is DATABASE_URL or Supabase (ADR-0003).
#
#   make up
#
# The whole system in containers is docker-compose.yml (E10.1, ADR-0007).

# Its own project name: docker-compose.yml is project `rewind`, and both define a `redis`
# service, so without this starting the full stack would take over the dev container.
name: rewind-dev

services:
  redis:
    image: redis:7-alpine
    container_name: rewind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
