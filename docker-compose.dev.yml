# Development backing services.
#
# Postgres is gone — the database is Supabase (ADR-0003). Only Redis remains, for
# the ARQ job queue, because a hosted queue would add a network dependency to every
# job state transition for no benefit at this scale.
#
# The application itself runs on the host during development: Docker on Apple
# silicon has no Metal passthrough, so a containerised worker cannot reach the GPU.
# See docs/09-deployment.md §8.
#
#   make up
#
# The full stack, including containerised app services, lives in
# docker-compose.yml and arrives with E10.1.

services:
  redis:
    image: redis:7-alpine
    container_name: rewind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
