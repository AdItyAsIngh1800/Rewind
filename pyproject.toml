[project]
name = "rewind"
version = "0.1.0"
description = "Evidence-backed AI incident reconstruction engine for multi-camera video"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Queue and cache
    "redis>=5.2",
    "arq>=0.26",
    # Geometry — correct on the vertex and edge cases a hand-rolled
    # point-in-polygon gets wrong, and zone logic is load-bearing here.
    "shapely>=2.0",
    "numpy>=2.1",
    # Supabase: storage buckets and auth. The database itself is reached over
    # plain SQLAlchemy through the Supavisor pooler, not through this client.
    "supabase>=2.10",
    # Config and logging
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Vision and ML. Backend pinned in PS-2: Apple Silicon / Metal (MPS).
# The default macOS arm64 torch wheel ships MPS support — no index URL,
# no CUDA variant. See docs/09-deployment.md.
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",          # AGPL-3.0 — see LICENSE and ADR-0002
    "opencv-python-headless>=4.10",
    "supervision>=0.25",
    "motmetrics>=1.4",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Multiple top-level roots, installed editable by `uv sync` so that
# `from packages.schemas import ...` works in tests, scripts and containers alike.
packages = ["packages", "apps", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ml/notebooks", "apps/web"]

[tool.ruff.lint]
# D   = pydocstyle     — every module, class and function carries a docstring
# ANN = annotations    — every argument and return value is typed
# T20 = flake8-print   — output goes through logging, never print; see
#                        services/observability/logging.py for why
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "T20"]
ignore = [
    "D203",   # conflicts with D211; we use "no blank line before class docstring"
    "D213",   # conflicts with D212; we use "summary on the first line"
    "ANN401", # typing.Any is legitimate for JSONB payloads and event payloads
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; the template supplies docstrings, but the module header is
# generated from the revision message and is not worth policing.
"packages/database/migrations/versions/*" = ["D400", "D415"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["ml/notebooks", "apps/web"]

[[tool.mypy.overrides]]
module = ["supervision.*", "motmetrics.*", "cv2.*", "shapely.*"]
ignore_missing_imports = true
